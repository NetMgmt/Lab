name: Build and push images

# Only run when stuff's pushed to main (i.e. when PRs are merged)
on:
  push:
    # branches: [ main ]

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push base image
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          push: true
          tags: ghcr.io/netmgmt/base:latest

      - name: Build and push l1 image
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          context: ./l1
          push: true
          tags: ghcr.io/netmgmt/gp1:latest

      - name: Build and push l2 image
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          context: ./l2
          push: true
          tags: ghcr.io/netmgmt/gp2:latest

      - name: Build and push l3 image
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          context: ./l3
          push: true
          tags: ghcr.io/netmgmt/gp3:latest
